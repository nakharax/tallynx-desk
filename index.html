    <script>
      (function () {
        try {
          var requested = new URLSearchParams(window.location.search).get('theme');
          requested = requested && requested.trim().toLowerCase();
          var dark = requested === 'obsidian' || requested === 'dark';
          if (!dark && requested !== 'alabaster' && requested !== 'light') {
            dark = (localStorage.getItem('TREDYN_THEME') || localStorage.getItem('TREDYN_DESK_THEME')) === 'obsidian';
          }
          if (dark) {
            document.documentElement.dataset.theme = 'obsidian';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#05070B');
          }
        } catch (error) {}
      })();

      (function () {
        function isViteWsError(msg) {
          if (!msg) return false;
          var s = String(msg);
          return s.includes('WebSocket closed without opened') ||
                 s.includes('failed to connect to websocket') ||
                 s.includes('@vite/client');
        }
        window.addEventListener('unhandledrejection', function (event) {
          if (
            isViteWsError(event.reason) ||
            isViteWsError(event.reason && event.reason.message)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function (event) {
          if (
            isViteWsError(event.message) ||
            isViteWsError(event.error)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>

        <h1 aria-label="TallyNX" class="splash-wordmark">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 133 20" width="120" height="18" fill="currentColor" aria-hidden="true">

          </svg>
        </h1>
        <p class="splash-tagline">QUANT RISK OS</p>
        <p id="app-splash-desc" data-th="กำลังโหลด TallyNX Mall…">
          Loading TallyNX Mall…
        </p>
        <div class="splash-spinner" aria-hidden="true"></div>
        <style>
          #app-splash {
            --splash-canvas: #FFFFFF;
            --splash-ink: #09090B;
            --splash-muted: #52525B;
            --splash-border: #DBEAFE;
            --splash-accent: #0752E8;
            --splash-mark-shadow: drop-shadow(0 6px 14px rgb(7 82 232 / 18%));
          }
          [data-theme="obsidian"] #app-splash {
            --splash-canvas: #05070B;
            --splash-ink: #FFFFFF;
            --splash-muted: #94A3B8;
            --splash-border: #1E293B;
            --splash-accent: #2563EB;
            --splash-mark-shadow: drop-shadow(0 6px 16px rgb(37 99 235 / 32%));
          }
          .splash-mark {
            display: block;
            margin-bottom: 16px;
            filter: var(--splash-mark-shadow);
          }
          .splash-wordmark {
            margin: 0;
            line-height: 1;
          }
          .splash-wordmark svg {
            display: block;
          }
          .splash-tagline {
            margin: 6px 0 18px;
            color: var(--splash-muted);
            font: 600 10px/1 'JetBrains Mono', ui-monospace, monospace;
            letter-spacing: 0.18em;
          }
          #app-splash-desc {
            margin: 0 0 14px;
            color: var(--splash-muted);
            font-size: 13px;
          }
          .splash-spinner {
            width: 20px;
            height: 20px;
            box-sizing: border-box;
            border: 2px solid var(--splash-border);
            border-top-color: var(--splash-accent);
            border-radius: 50%;
          }
          @media (prefers-reduced-motion: no-preference) {
            .splash-spinner { animation: nx-spin 0.8s linear infinite; }
          }
          @keyframes nx-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
        <div id="splash-fallback-actions" style="display: none; margin-top: 24px; flex-direction: column; align-items: center; gap: 8px;">
          <p data-th="TallyNX Mall ใช้เวลาโหลดนานกว่าปกติ" style="font-size: 12px; margin: 0 0 10px 0;">TallyNX Mall is taking longer than expected to load.</p>
          <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
            <button
              type="button"
              data-th="โหลดหน้าใหม่"
              onclick="window.location.reload()"
              style="padding: 8px 18px; border-radius: 8px; border: 1px solid #141618; background: #141618; color: #F8F6F0; font-size: 13px; font-weight: 500; cursor: pointer;"
            >
              Reload
            </button>
            <button
              type="button"
              data-th="ล้างข้อมูลในเครื่องและโหลดใหม่"
              onclick="try{ localStorage.clear(); sessionStorage.clear(); if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(function(regs){ for(var r of regs) r.unregister(); }); } }catch(e){} window.location.reload();"
              style="padding: 8px 18px; border-radius: 8px; border: 1px solid #D6D1C7; background: #FFFFFF; color: #141618; font-size: 13px; font-weight: 500; cursor: pointer;"
            >
              Clear local data and reload
            </button>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          var requested = new URLSearchParams(window.location.search).get('lang');
          var lang = requested === 'en' || requested === 'th'
            ? requested
            : localStorage.getItem('TALLYNX_LANG') || localStorage.getItem('tredyn_lang');
          if (lang === 'th') {
            document.documentElement.lang = 'th';
            document.querySelectorAll('#app-splash [data-th]').forEach(function (element) {
              element.textContent = element.getAttribute('data-th');
            });
          }
        } catch (error) {
          // Keep the English splash when storage is unavailable.
        }
      })();

      setTimeout(function () {
        var actions = document.getElementById('splash-fallback-actions');
        if (actions) {
          actions.style.display = 'flex';
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.tsx"></script>

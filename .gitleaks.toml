# Tredyn Desk — Gitleaks secret scanning policy (modeled on institutional CI hygiene)
title = "Tredyn Desk gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known non-secret client configs, lockfile integrity hashes, and build artifacts"

paths = [
  '''\.env\.example$''',
  '''package-lock\.json$''',
  '''^\.gitleaks\.toml$''',
  '''^firebase-applet-config\.json$''',
  '''^dist/''',
  '''^dev-dist/''',
  '''^node_modules/''',
  '''^\.vercel/''',
  '''^scripts/ci-policy-guard\.mjs$''',
]

regexTargets = ["match"]
regexes = [
  '''(your_api_key|your-api-key|test-mock-key|placeholder)''',
]
